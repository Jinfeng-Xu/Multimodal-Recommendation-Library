embedding_size: 64
feat_embed_dim: 64
n_mm_layers: 1
n_layers: 2
knn_k: 10
mm_image_weight: 0.1
aggr_mode: "add"
learning_rate: 0.0001
weight_size: 64
lambda_coeff: 0.9
lambda_spec: [0.1]
dct_keep_ratio: 0.2
beta_lf: 0.6
beta_hf: 0.2
beta_mix: 0.2
spec_gate_tau: 1
enable_spec_gate: False
enable_residual: False
decay_base: 0.9
decay_weight: [0.95]
weight_decay: [1e-4]
item_co_topk: 10
alpha_item_co: [0.2]
cui_topk: 10
cui_theta: 0.1
cui_gamma: [0.1]

# Graph perturbation SSL — kept (same as DuGRec)
gpert_mask_p: 0.2
gpert_lambda: [1e-4]

# NCER — retained, fixed at 0.5 (minimal effect, zero cost)
ncer_alpha: [0.5]

# ─── Innovation 2a: Residual II Gate (RIG) ───
# Learnable per-item gate on II propagation contribution.
# Trained end-to-end via BPR — no conflicting auxiliary loss.
# rig_on: [True, False] tests gate vs standard residual.
rig_on: [True, False]

# ─── Innovation 2b: II-Neighbor BPR Augmentation (INA) ───
# Uses II-graph neighbors as soft BPR positives.
# Compatible with BPR (both push same direction).
# ina_lambda=0 disables INA, leaving only RIG.
ina_lambda: [0, 0.2, 0.4, 0.6, 0.8]
ina_topk: 5
ina_margin_discount: 0.5

# baby (bimodal: visual + text)
n_ui_layers: 3
reg_weight: [0.001]
dropout: 0.1
clu_lambda: [1e-4]
cli_lambda: [1e-5]

